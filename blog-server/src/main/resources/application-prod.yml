spring:
  flyway:
    # 生产只跑结构迁移，绝不加载演示数据
    locations: classpath:db/migration
  datasource:
    hikari:
      maximum-pool-size: 20

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

app:
  jwt:
    # 生产必须显式注入；缺失时启动失败，绝不回退到仓库里的开发默认值
    secret: ${JWT_SECRET}
    # 允许用环境变量关闭：纯 HTTP 部署（如内网 IP）时必须为 false
    cookie-secure: ${COOKIE_SECURE:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://www.eas0n.top,https://admin.eas0n.top}

logging:
  level:
    root: WARN
    com.eason.blog: INFO

server:
  # 不启用 Spring 自带的 ForwardedHeaderFilter：它不校验代理链，会直接采信 XFF。
  # 客户端 IP 统一由 ClientIp 从可信代理链解析。
  forward-headers-strategy: none
