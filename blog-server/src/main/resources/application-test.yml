spring:
  datasource:
    url: jdbc:mysql://${TEST_DB_HOST:127.0.0.1}:${TEST_DB_PORT:3306}/${TEST_DB_NAME:eason_blog_test}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${TEST_DB_USER:blog}
    password: ${TEST_DB_PASSWORD:blog_dev_pwd}
  flyway:
    # 测试库每次从零重建，确保迁移脚本本身可重复执行
    clean-disabled: false
    clean-on-validation-error: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

app:
  jwt:
    secret: test-secret-should-be-at-least-32-bytes-long
  demo-data:
    enabled: false
  register:
    enabled: true
  rate-limit:
    enabled: false

logging:
  level:
    root: WARN
    com.eason.blog: INFO
