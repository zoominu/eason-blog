server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: blog-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false
  servlet:
    multipart:
      # 与 ResourceService 的 20MB 校验、Nginx client_max_body_size 20m 保持一致
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:eason_blog}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:blog}
    password: ${DB_PASSWORD:blog_dev_pwd}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 只在开发期打印 SQL；生产由 application-prod.yml 覆盖
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# 应用自有配置：全部可通过环境变量覆盖，禁止把真实密钥写进仓库
app:
  jwt:
    # 开发默认值仅用于本地；生产必须通过 JWT_SECRET 注入 >= 32 字节随机串
    secret: ${JWT_SECRET:dev-only-change-me-please-32bytes-minimum-secret}
    expire-minutes: ${JWT_EXPIRE_MINUTES:120}
    cookie-name: ${JWT_COOKIE_NAME:blog_token}
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  bootstrap-admin:
    email: ${BLOG_ADMIN_EMAIL:}
    password: ${BLOG_ADMIN_PASSWORD:}
    nickname: ${BLOG_ADMIN_NICKNAME:Eason}
  register:
    enabled: ${REGISTER_ENABLED:true}
  storage:
    upload-dir: ${UPLOAD_DIR:./data/uploads}

logging:
  level:
    root: INFO
    com.eason.blog: DEBUG
