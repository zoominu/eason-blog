# ============================================================
# Eason Blog - Nginx 生产配置（方案 B：同域部署 /、/admin/、/api/）
# 放置到 /etc/nginx/conf.d/eason-blog.conf，证书路径按实际修改。
# 同域部署可以避免跨域 Cookie 的 SameSite/CSRF 复杂度。
# ============================================================

# HTTP 一律跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name www.eas0n.top eas0n.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.eas0n.top eas0n.top;

    ssl_certificate     /etc/letsencrypt/live/eas0n.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eas0n.top/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 安全响应头：注意 CSP 需要按实际 CDN/字体来源调整
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # ---------- 前台（Vue SPA）----------
    root /var/www/eason-blog/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- 后台（/admin/ 子路径）----------
    # 构建前设置 vite base='/admin/'；此处 alias 指向后台 dist
    location /admin/ {
        alias /var/www/eason-blog/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # ---------- 后端 API ----------
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------- 运维接口只允许内网 ----------
    location /actuator/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }

    # 上传文件：禁止执行脚本，只作为静态资源返回
    location /uploads/ {
        alias /var/www/eason-blog/uploads/;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Disposition "inline";
        location ~ \.(php|jsp|asp|aspx|sh|exe)$ {
            deny all;
        }
    }

    access_log /var/log/nginx/eason-blog.access.log;
    error_log  /var/log/nginx/eason-blog.error.log warn;
}
