# Eason Blog Nginx 模板
# 直接对外：listen 80；在雷池/WAF 后面：改成 listen 8080
# 放置到 /etc/nginx/sites-available/eason-blog.conf 并软链到 sites-enabled

server {
    listen 80;
    server_name _;

    # 必须：否则 /admin 会 301 到 http://host:8080/admin/
    absolute_redirect off;

    # 与后端 200MB 上传限制对齐
    client_max_body_size 210m;

    root /var/www/eason-blog/frontend;
    index index.html;

    # 上传文件只做静态返回，不执行脚本
    location /uploads/ {
        alias /opt/eason-blog/data/uploads/;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Disposition "inline";
        location ~ \.(php|jsp|asp|aspx|sh|exe)$ {
            deny all;
        }
    }

    # 后台 SPA
    location /admin/ {
        alias /var/www/eason-blog/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SEO / RSS
    location = /rss.xml {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /robots.txt {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # actuator 只允许本机
    location /actuator/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8081;
    }

    # 前台 SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/eason-blog.access.log;
    error_log  /var/log/nginx/eason-blog.error.log warn;
}
