name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试（MySQL 8 + Flyway + MockMvc）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: eason_blog_test
          MYSQL_USER: blog
          MYSQL_PASSWORD: blog_dev_pwd
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        working-directory: blog-server
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_NAME: eason_blog_test
          TEST_DB_USER: blog
          TEST_DB_PASSWORD: blog_dev_pwd
        run: mvn -B -ntp test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: blog-server/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: 前台 / 后台构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Build blog-frontend
        working-directory: blog-frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build blog-admin
        working-directory: blog-admin
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            blog-frontend/dist/
            blog-admin/dist/
          if-no-files-found: error
